change_type: enhancement
component: operator
note: Apply curve preferences of the OpenShift cluster TLS profile to the gateway, webhook, and Tempo components
issues: [1674,1683]
subtext: |
  Curve preferences are always applied to Tempo receivers. To apply them to internal Tempo servers,
  enable `featureGates.tempoTLSCurvePreferences` (note that this requires a patched Tempo image).
