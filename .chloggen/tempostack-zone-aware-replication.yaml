# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. tempostack, tempomonolithic, github action)
component: tempostack

# A brief description of the change. Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Support zone-aware replication of a TempoStack via the new spec.replication field.

# One or more tracking issues related to the change
issues: [1585]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  `spec.replication.zones` spreads the pods of every component across the given topology domains
  using topology spread constraints, and configures the ingester ring to replicate spans across
  those zones:

  ```yaml
  spec:
    replication:
      factor: 3
      zones:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
  ```

  `spec.replication.factor` supersedes `spec.replicationFactor`, which is now deprecated but keeps
  working. If both are set, `spec.replication.factor` takes precedence and the operator emits a
  warning.

  The API and its behaviour follow the Grafana Loki Operator.
