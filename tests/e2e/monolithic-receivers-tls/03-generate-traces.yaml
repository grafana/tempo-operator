apiVersion: batch/v1
kind: Job
metadata:
  name: generate-traces-grpc
spec:
  template:
    spec:
      containers:
        - name: telemetrygen
          image: ghcr.io/grafana/tempo-operator/test-utils:sha-0fc5ef0
          command:
            - telemetrygen
            - traces
            - --otlp-endpoint=opentelemetry-collector:4317
            - --service=grpc
            - --otlp-insecure
            - --traces=10
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-traces-http
spec:
  template:
    spec:
      containers:
        - name: telemetrygen
          image: ghcr.io/grafana/tempo-operator/test-utils:sha-0fc5ef0
          command:
            - telemetrygen
            - traces
            - --otlp-endpoint=opentelemetry-collector:4318
            - --otlp-http
            - --otlp-insecure
            - --service=http
            - --traces=10
      restartPolicy: Never
