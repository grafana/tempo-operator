# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tempostack-extraconfig
spec:
  description: Test extra config in TempoStack
  namespace: chainsaw-tempoextcfg
  steps:
  - name: Install env Secret and Minio storage
    try:
    - apply:
        file: 00-install-env-secret.yaml
    - apply:
        file: 00-install-storage.yaml
    - assert:
        file: 00-install-storage-assert.yaml
  - name: Install TempoStack
    try:
    - apply:
        file: 01-install-tempostack.yaml
    - assert:
        timeout: 5m
        file: 01-install-tempostack-assert.yaml
    catch:
    - get:
        apiVersion: tempo.grafana.com/v1alpha1
        kind: TempoStack
        format: yaml
    - podLogs:
        selector: app.kubernetes.io/managed-by=tempo-operator
  - name: Verify extraConfig in ConfigMap
    try:
    - script:
        timeout: 1m
        content: ./verify-extraconfig.sh
