apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: azure-wif-tempostack
  labels:
    type: azure-wif
spec:
  description: Test TempoStack support for Azure WIF using STS.
  namespace: chainsaw-azurewif-tempo
  steps:
  - name: Create Azure WIF bucket
    try:
    - script:
        timeout: 10m
        content: ./azure-wif-create.sh
    - assert:
        file: 00-azure-wif-create-assert.yaml
  - name: Install TempoStack
    try:
    - apply:
        file: 01-install-tempostack.yaml
    - assert:
        timeout: 5m
        file: 01-install-tempostack-assert.yaml
    catch:
    - get:
        apiVersion: tempo.grafana.com/v1alpha1
        kind: TempoStack
        format: yaml
    - podLogs:
        selector: app.kubernetes.io/managed-by=tempo-operator
  - name: Generate traces
    try:
    - apply:
        file: 03-generate-traces.yaml
    - assert:
        file: 03-generate-traces-assert.yaml
  - name: Verify traces
    try:
    - apply:
        file: 04-verify-traces.yaml
    - assert:
        file: 04-verify-traces-assert.yaml
  - name: Delete resource group
    try:
    - script:
        timeout: 5m
        content: ./azure-wif-delete.sh
