apiVersion: batch/v1
kind: Job
metadata:
  name: generate-traces
  namespace: chainsaw-gcpwif-tempo
spec:
  template:
    spec:
      containers:
      - name: telemetrygen
        image: ghcr.io/grafana/tempo-operator/test-utils:sha-0fc5ef0
        command:
        - telemetrygen
        - traces
        - --otlp-endpoint=tempo-gcpwiftm-distributor.chainsaw-gcpwif-tempo.svc:4317
        - --otlp-insecure
        - --traces=10
      restartPolicy: Never
  backoffLimit: 4
