apiVersion: batch/v1
kind: Job
metadata:
  name: generate-traces
  namespace: chainsaw-gcpwif-mono
spec:
  template:
    spec:
      containers:
      - name: telemetrygen
        image: ghcr.io/grafana/tempo-operator/test-utils:main
        command:
        - telemetrygen
        - traces
        - --otlp-endpoint=tempo-gcpwifmn.chainsaw-gcpwif-mono.svc:4317
        - --otlp-insecure
        - --traces=10
      restartPolicy: Never
  backoffLimit: 4
