apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: monolithic-ibm
spec:
  concurrent: false
  steps:
  - name: step-00
    try:
    - script:
        timeout: 5m
        content: ./create-bucket.sh
    - assert:
        file: 00-assert.yaml
  - name: step-01
    try:
    - apply:
        file: 01-install-tempo.yaml
    - assert:
        timeout: 5m
        file: 01-assert.yaml
    catch:
    - get:
        apiVersion: tempo.grafana.com/v1alpha1
        kind: TempoMonolithic
        format: yaml
    - podLogs:
        selector: app.kubernetes.io/managed-by=tempo-operator
  - name: step-03
    try:
    - apply:
        file: 03-generate-traces.yaml
    - assert:
        file: 03-assert.yaml
  - name: step-04
    try:
    - apply:
        file: 04-verify-traces.yaml
    - assert:
        file: 04-assert.yaml
  - name: Delete IBM cloud bucket
    try:
    - script:
        timeout: 5m
        content: ./delete-bucket.sh
