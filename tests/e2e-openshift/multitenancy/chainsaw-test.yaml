# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: multitenancy
spec:
  namespace: chainsaw-multitenancy
  steps:
  - name: step-00
    try:
    - apply:
        file: 00-install-storage.yaml
    - assert:
        file: 00-assert.yaml
  - name: step-00-workload-monitoring
    # Monitoring is shared by concurrent tests and remains enabled after the suite.
    skipDelete: true
    try:
    - apply:
        file: ../_common/user-workload-monitoring.yaml
    - assert:
        file: ../_common/user-workload-monitoring-assert.yaml
  - name: step-01
    try:
    - apply:
        file: 01-install-tempo.yaml
    - assert:
        file: 01-assert.yaml
  - name: step-02
    try:
    - apply:
        file: 02-install-otelcol.yaml
    - assert:
        file: 02-assert.yaml
  - name: step-03
    try:
    - apply:
        file: 03-generate-traces.yaml
    - assert:
        file: 03-assert.yaml
  - name: step-04
    try:
    - apply:
        file: 04-verify-traces.yaml
    - assert:
        file: 04-assert.yaml
  - name: step-05-check-metrics
    try:
    - apply:
        file: ../_common/e2e-metrics-reader.yaml
    - script:
        timeout: 5m
        content: |
          set -euo pipefail
          ../_common/verify-metrics.sh \
            "tempo_query_frontend_queries_total{namespace='$NAMESPACE'}" \
            "tempo_request_duration_seconds_count{namespace='$NAMESPACE'}" \
            "tempo_request_duration_seconds_sum{namespace='$NAMESPACE'}" \
            "tempo_request_duration_seconds_bucket{namespace='$NAMESPACE'}" \
            "tempo_build_info{namespace='$NAMESPACE'}" \
            "tempo_ingester_bytes_received_total{namespace='$NAMESPACE'}" \
            "tempo_ingester_flush_failed_retries_total{namespace='$NAMESPACE'}" \
            "tempo_ingester_failed_flushes_total{namespace='$NAMESPACE'}" \
            "tempo_ring_members{namespace='$NAMESPACE'}"
