# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: red-metrics
spec:
  namespace: chainsaw-redmetrics
  steps:
  - name: step-00
    try:
    - apply:
        file: 00-install-storage.yaml
    - assert:
        file: 00-assert.yaml
  - name: step-01
    # Monitoring is shared by concurrent tests and remains enabled after the suite.
    skipDelete: true
    try:
    - apply:
        file: ../_common/user-workload-monitoring.yaml
    - assert:
        file: ../_common/user-workload-monitoring-assert.yaml
  - name: step-02
    try:
    - apply:
        file: 02-install-otel-collector.yaml
    - assert:
        file: 02-assert.yaml
  - name: step-03
    try:
    - apply:
        file: 03-install-tempo.yaml
    - assert:
        timeout: 5m
        file: 03-assert.yaml
  - name: step-04
    try:
    - apply:
        file: 04-install-hotrod.yaml
    - assert:
        file: 04-assert.yaml
  - name: step-05
    try:
    - apply:
        file: 05-install-generate-traces.yaml
    - assert:
        file: 05-assert.yaml
  - name: step-06
    try:
    - apply:
        file: 06-install-assert-job.yaml
    - assert:
        file: 06-assert.yaml
    - script:
        timeout: 5m
        content: ./check_alert.sh
  - name: step-07
    try:
    - apply:
        file: ../_common/e2e-metrics-reader.yaml
    - script:
        timeout: 5m
        content: |
          set -euo pipefail
          ../_common/verify-metrics.sh \
            "traces_span_metrics_duration_bucket{namespace='$NAMESPACE'}" \
            "traces_span_metrics_duration_count{namespace='$NAMESPACE'}" \
            "traces_span_metrics_duration_sum{namespace='$NAMESPACE'}" \
            "traces_span_metrics_calls{namespace='$NAMESPACE'}"
