apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: multitenancy-rbac
spec:
  namespace: chainsaw-rbac
  steps:
  - name: step-00
    try:
    - apply:
        file: 00-install-storage.yaml
    - assert:
        file: 00-assert.yaml
  - name: step-01
    try:
    - apply:
        file: 01-install-tempo.yaml
    - assert:
        file: 01-assert.yaml
  - name: step-02
    try:
    - apply:
        file: 02-install-otelcol.yaml
    - assert:
        file: 02-assert.yaml
  - name: step-03
    try:
    - apply:
        file: 03-create-serviceaccounts.yaml
    - assert:
        file: 03-assert.yaml
  - name: step-04
    try:
    - apply:
        file: 04-generate-traces.yaml
    - assert:
        file: 04-assert.yaml
  - name: step-05
    try:
    - apply:
        file: 05-verify-traces.yaml
    - assert:
        file: 05-assert.yaml
    catch:
    - podLogs:
        selector: job-name=verify-traces-sa-1
        namespace: chainsaw-test-rbac-1
    - podLogs:
        selector: job-name=verify-traces-kubeadmin
        namespace: chainsaw-rbac
