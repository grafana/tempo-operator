apiVersion: batch/v1
kind: Job
metadata:
  name: generate-traces-grpc
  namespace: chainsaw-replicas
spec:
  template:
    spec:
      containers:
      - name: telemetrygen
        image: ghcr.io/grafana/tempo-operator/test-utils:main
        command:
        - telemetrygen
        - traces
        - --otlp-endpoint=dev-collector:4317
        - --service=grpc
        - --otlp-insecure
        - --traces=10
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-traces-http
  namespace: chainsaw-replicas
spec:
  template:
    spec:
      containers:
        - name: telemetrygen
          image: ghcr.io/grafana/tempo-operator/test-utils:main
          command:
            - telemetrygen
            - traces
            - --otlp-endpoint=dev-collector:4318
            - --otlp-http
            - --otlp-insecure
            - --service=http
            - --traces=10
      restartPolicy: Never
