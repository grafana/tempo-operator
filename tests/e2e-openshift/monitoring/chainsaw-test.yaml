# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: monitoring
spec:
  namespace: chainsaw-monitoring
  steps:
  - name: step-00
    try:
    - apply:
        file: 00-install-storage.yaml
    - assert:
        file: 00-assert.yaml
  - name: step-01
    # Monitoring is shared by concurrent tests and remains enabled after the suite.
    skipDelete: true
    try:
    - apply:
        file: ../_common/user-workload-monitoring.yaml
    - assert:
        file: ../_common/user-workload-monitoring-assert.yaml
  - name: Enable OpenShift platform monitoring on the Tempo operator namespace
    try:
    - script:
        content: |
          set -euo pipefail
          namespace=$(oc get pods -A \
            -l control-plane=controller-manager,app.kubernetes.io/name=tempo-operator \
            -o jsonpath='{.items[0].metadata.namespace}')
          oc label namespace "$namespace" openshift.io/cluster-monitoring=true --overwrite
  - name: step-02
    try:
    - apply:
        file: 02-install-tempostack.yaml
    - assert:
        file: 02-assert.yaml
  - name: step-03
    try:
    - apply:
        file: 03-generate-traces.yaml
    - assert:
        file: 03-assert.yaml
  - name: step-04
    try:
    - apply:
        file: 04-verify-traces.yaml
    - assert:
        file: 04-assert.yaml
  - name: step-05
    try:
    - command:
        entrypoint: oc
        args:
        - get
        - pods
        - -A
        - -l control-plane=controller-manager
        - -l app.kubernetes.io/name=tempo-operator
        - -o
        - jsonpath={.items[0].metadata.namespace}
        outputs:
        - name: TEMPO_NAMESPACE
          value: ($stdout)
    - apply:
        file: ../_common/e2e-metrics-reader.yaml
    - script:
        timeout: 5m
        content: |
          set -euo pipefail
          ../_common/verify-metrics.sh \
            "tempo_operator_tempostack_managed" \
            "tempo_operator_tempostack_storage_backend{type='s3'}" \
            "tempo_operator_tempostack_multi_tenancy{type='disabled'}" \
            "tempostack_status_condition{stack_namespace='$NAMESPACE',stack_name='tempostack',condition='Ready'} == 1" \
            "tempo_query_frontend_queries_total{namespace='$NAMESPACE'}" \
            "tempo_request_duration_seconds_count{namespace='$NAMESPACE'}" \
            "tempo_request_duration_seconds_sum{namespace='$NAMESPACE'}" \
            "tempo_request_duration_seconds_bucket{namespace='$NAMESPACE'}" \
            "tempo_build_info{namespace='$NAMESPACE'}" \
            "tempo_ingester_bytes_received_total{namespace='$NAMESPACE'}" \
            "tempo_ingester_flush_failed_retries_total{namespace='$NAMESPACE'}" \
            "tempo_ingester_failed_flushes_total{namespace='$NAMESPACE'}" \
            "tempo_ring_members{namespace='$NAMESPACE'}"
    - assert:
        file: 05-assert-operator-servicemonitor.yaml
