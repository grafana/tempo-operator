apiVersion: batch/v1
kind: Job
metadata:
  name: verify-traces
spec:
  template:
    spec:
      containers:
      - name: verify-traces
        image: ghcr.io/grafana/tempo-operator/test-utils:sha-0fc5ef0
        command:
        - /bin/bash
        - -eux
        - -c
        args:
        - |
          curl -v -G http://tempo-tempostack-query-frontend:16686/api/services | tee /tmp/out.log
          if ! grep -q telemetrygen /tmp/out.log; then
            echo && echo "No traces found"
            exit 1
          fi
      restartPolicy: Never
