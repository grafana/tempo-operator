apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-metrics-reader
---
# Cluster role binding required for fetching metrics from Thanos querier.
# The ClusterRoleBinding is not a Tempo requirement and is used only by the test case to check the metrics using the verify-metrics.sh script.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: (join('-', ['e2e-metrics-reader', $namespace]))
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
- kind: ServiceAccount
  name: e2e-metrics-reader
  namespace: ($namespace)
