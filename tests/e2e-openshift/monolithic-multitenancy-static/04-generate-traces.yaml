apiVersion: batch/v1
kind: Job
metadata:
  name: generate-traces
spec:
  template:
    spec:
      containers:
      - name: telemetrygen
        image: ghcr.io/grafana/tempo-operator/test-utils:main
        command:
        - telemetrygen
        - traces
        - --otlp-endpoint=opentelemetry-collector:4317
        - --otlp-insecure
        - --traces=10
      restartPolicy: Never
