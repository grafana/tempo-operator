apiVersion: batch/v1
kind: Job
metadata:
  name: generate-traces
spec:
  template:
    spec:
      containers:
      - name: telemetrygen
        image: ghcr.io/grafana/tempo-operator/test-utils:main
        command:
        - telemetrygen
        - traces
        - --otlp-endpoint=tempo-monitor:4317
        - --otlp-insecure
        - --duration=3m
        - --workers=1
        - --span-duration=1s
      restartPolicy: Never
