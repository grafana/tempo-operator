apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: monitoring-monolithic
spec:
  description: Test metrics produced by Tempo Monolithc can be scraped by in-cluster monitoring
  steps:
  - name: Enable user workload monitoring
    # Monitoring is shared by concurrent tests and remains enabled after the suite.
    skipDelete: true
    try:
    - apply:
        file: ../_common/user-workload-monitoring.yaml
    - assert:
        file: ../_common/user-workload-monitoring-assert.yaml
  - name: Create Tempo Monolithc instance
    try:
    - apply:
        file: 01-install-monolithic.yaml
    - assert:
        file: 01-install-monolithic-assert.yaml
  - name: Generate traces and export to the Monolithc instance
    try:
    - apply:
        file: 02-generate-traces.yaml
    - assert:
        file: 02-generate-traces-assert.yaml
  - name: Verify traces in Monolithic instance
    try:
    - apply:
        file: 03-verify-traces.yaml
    - assert:
        file: 03-verify-traces-assert.yaml
  - name: Check Tempo Monolithc metrics scraped by user workload monitoring
    try:
    - apply:
        file: ../_common/e2e-metrics-reader.yaml
    - script:
        timeout: 5m
        content: |
          set -euo pipefail
          ../_common/verify-metrics.sh \
            "tempo_query_frontend_queries_total{namespace='$NAMESPACE'}" \
            "tempo_distributor_bytes_received_total{namespace='$NAMESPACE'}" \
            "tempo_distributor_spans_received_total{namespace='$NAMESPACE'}" \
            "tempo_ingester_bytes_received_total{namespace='$NAMESPACE'}" \
            "tempo_distributor_traces_per_batch_count{namespace='$NAMESPACE'}" \
            "tempo_build_info{namespace='$NAMESPACE'}"
