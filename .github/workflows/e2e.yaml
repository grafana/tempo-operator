name: "End-to-end tests"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  e2e-tests:
    name: End-to-end tests ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # The e2e tests are run on the lowest and highest supported k8s version.
        # All Kubernetes version in between expose the same APIs, hence the operator
        # should be compatible with them.
        include:
          - name: min
            kube-version: "1.25"
          - name: max
            kube-version: "1.36"

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Install chainsaw
      run: |
        set -e
        make chainsaw

    - name: "run tests"
      env:
        KUBE_VERSION: ${{ matrix.kube-version }}
      run: |
        make \
          prepare-e2e \
          e2e-enable-debug-logs \
          e2e \
          e2e-operator-metrics \
          e2e-reconcile-count \
          KUBE_VERSION="$KUBE_VERSION"

    - name: Collect diagnostics on failure
      if: failure()
      run: |
        echo "=== Operator logs ==="
        kubectl logs -n tempo-operator-system deployment/tempo-operator-controller


  upgrade-tests:
    name: Upgrade tests ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - name: max
            kube-version: "1.36"

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Start kind
      run: kind create cluster --config kind-${{ matrix.kube-version }}.yaml --wait 5m

    - name: Start a local container registry with TLS
      run: |
        # install mkcert with pinned version and checksum for reproducible builds
        MKCERT_VERSION=v1.4.4
        MKCERT_SHA256=6d31c65b03972c6dc4a14ab429f2928300518b26503f58723e532d1b0a3bbb52
        curl -sLo mkcert "https://github.com/FiloSottile/mkcert/releases/download/${MKCERT_VERSION}/mkcert-${MKCERT_VERSION}-linux-amd64"
        echo "${MKCERT_SHA256}  mkcert" | sha256sum -c
        chmod +x mkcert
        sudo cp mkcert /usr/local/bin/mkcert

        # create and install root CA in system store
        sudo mkcert -install
        sudo systemctl restart docker

        # copy root CA in kind's system store
        sudo docker cp "$(sudo mkcert -CAROOT)/rootCA.pem" kind-control-plane:/usr/local/share/ca-certificates/mkcert.crt
        docker exec kind-control-plane update-ca-certificates
        docker exec kind-control-plane systemctl restart containerd

        # generate cert for registry
        mkdir -p /tmp/localregistry/certs
        sudo mkcert -cert-file /tmp/localregistry/certs/tls.crt -key-file /tmp/localregistry/certs/tls.key localregistry

        # make registry reachable
        host_ip=$(dig +short "$(hostname)" | head -n1)
        echo "$host_ip localregistry" | sudo tee -a /etc/hosts

        # start registry
        docker run -d \
          --restart=always \
          --name registry \
          -v /tmp/localregistry/certs:/certs \
          -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/tls.crt \
          -e REGISTRY_HTTP_TLS_KEY=/certs/tls.key \
          -p 5000:5000 \
          registry:2

    - name: Install chainsaw, OLM and minio
      run: |
        set -e
        make chainsaw olm-install

    - name: Build and push operator and bundle image to local container registry
      id: build
      run: |
        LATEST_VERSION=$(curl -sS --max-time 10 \
          "https://operatorhub.io/api/operator?packageName=tempo-operator" \
          | jq -r '.operator.version // empty' 2>/dev/null) || true

        if [ -z "$LATEST_VERSION" ]; then
          echo "::warning::OperatorHub API is unavailable, skipping upgrade tests"
          exit 0
        fi

        make opm
        export BUNDLE_IMGS=ghcr.io/grafana/tempo-operator/tempo-operator-bundle:v${LATEST_VERSION},${IMG_PREFIX}/tempo-operator-bundle:v${OPERATOR_VERSION}
        make bundle docker-build docker-push bundle-build bundle-push catalog-build catalog-push
        echo "run-upgrade=true" >> "$GITHUB_OUTPUT"
      env:
        IMG_PREFIX: localregistry:5000
        OPERATOR_VERSION: 100.0.0

    - name: Run tests
      if: steps.build.outputs.run-upgrade == 'true'
      run: make e2e-upgrade

    - name: Collect diagnostics on failure
      if: failure()
      run: |
        echo "=== Operator logs ==="
        kubectl logs -n tempo-operator-system deployment/tempo-operator-controller
