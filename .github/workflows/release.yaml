name: "Release"
on:
  push:
    branches:
      - 'main'
    paths:
      - CHANGELOG.md

permissions: {}

jobs:
  release:
    # Only the pull request created by hack/release/prepare-release.sh cuts a
    # release. Any other change to the CHANGELOG must not, and one can reach
    # main: the changelog workflow lets a pull request modify the CHANGELOG
    # when its title contains "[chore]" or it carries the "Skip Changelog"
    # label. "contains" rather than "startsWith" so this holds for squash,
    # rebase and merge commits alike.
    if: contains(github.event.head_commit.message, '[chore] Prepare release v')
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    outputs:
      operator_version: ${{ steps.operator-version.outputs.version }}
      already_released: ${{ steps.released.outputs.already_released }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: false

    - name: Determine operator version to release
      id: operator-version
      run: echo "version=$(grep -Eo '## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -n 1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    # Re-running the workflow, or merging a change that touches an already
    # released section of the CHANGELOG, should be a no-op rather than a
    # failure on "gh release create".
    - name: Check whether this version was already released
      id: released
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OPERATOR_VERSION: ${{ steps.operator-version.outputs.version }}
      run: |
        if gh release view "v${OPERATOR_VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo "::notice::v${OPERATOR_VERSION} has already been released, skipping."
          echo "already_released=true" >> "$GITHUB_OUTPUT"
        else
          echo "already_released=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Go
      if: steps.released.outputs.already_released == 'false'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: "generate release resources"
      if: steps.released.outputs.already_released == 'false'
      run: make release-artifacts
      env:
        IMG_PREFIX: ghcr.io/${{ github.repository }}

    - name: "create the release in GitHub"
      if: steps.released.outputs.already_released == 'false'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OPERATOR_VERSION: ${{ steps.operator-version.outputs.version }}
      run: |
        awk '/^## / {v=$2} v == "'"${OPERATOR_VERSION}"'" && !/^## / {print}' CHANGELOG.md > RELEASE_NOTES.md
        gh release create \
            -t "Release v${OPERATOR_VERSION}" \
            -F RELEASE_NOTES.md \
            "v${OPERATOR_VERSION}" \
            'dist/tempo-operator.yaml#Installation manifest for Kubernetes' \

  publish-images:
    needs: release
    if: needs.release.outputs.already_released == 'false'
    uses: ./.github/workflows/reusable-publish-images.yaml
    permissions:
      packages: write # push container image
    with:
      publish_bundle: true
      version_tag: v${{ needs.release.outputs.operator_version }}
      push: true

  # The OperatorHub pull requests are created locally by a release manager with
  # ./hack/release/operatorhub-release.sh, see RELEASE.md.
