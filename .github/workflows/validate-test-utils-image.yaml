name: "Validate test utils image"

on:
  pull_request:
    paths:
      - 'tests/Dockerfile.utils'
      - '.github/workflows/validate-test-utils-image.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Build
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: tests/
          file: tests/Dockerfile.utils
          platforms: linux/arm64,linux/amd64,linux/s390x,linux/ppc64le
          push: false
